<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bouncing Ball in a Cube</title>
  <style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0e14;
  font-family: "Segoe UI", system-ui, sans-serif;
  color: #dfe8f2;
}

canvas {
  display: block;
}

#ui {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 280px;
  padding: 16px 18px;
  background: rgba(15, 20, 30, 0.85);
  border: 1px solid rgba(120, 170, 255, 0.25);
  border-radius: 10px;
  backdrop-filter: blur(6px);
  user-select: none;
}

#ui h1 {
  margin: 0 0 8px;
  font-size: 16px;
  font-weight: 600;
  color: #9fd8ff;
}

#status {
  margin: 0 0 14px;
  font-size: 12px;
  line-height: 1.4;
  color: #aebbcc;
  min-height: 32px;
}

#ui label {
  display: block;
  margin-bottom: 12px;
  font-size: 12px;
}

#ui label span {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

#ui label b {
  color: #9fd8ff;
  font-weight: 600;
}

#ui input[type="range"] {
  width: 100%;
  accent-color: #5fb2ff;
}

#ui button {
  width: 100%;
  padding: 7px 0;
  font-size: 12px;
  color: #dfe8f2;
  background: rgba(95, 178, 255, 0.15);
  border: 1px solid rgba(95, 178, 255, 0.4);
  border-radius: 6px;
  cursor: pointer;
}

#ui button:hover {
  background: rgba(95, 178, 255, 0.3);
}

.hint {
  margin: 12px 0 0;
  font-size: 11px;
  line-height: 1.5;
  color: #7d8b9c;
}

  </style>
</head>
<body>
  <div id="ui">
    <h1>Bouncing Ball in a Cube</h1>
    <p id="status">Drag on any wall to place the ball and aim.</p>
    <label>
      <span>Bounciness <b id="bounciness-value">75%</b></span>
      <input type="range" id="bounciness" min="0" max="100" value="75" />
    </label>
    <label>
      <span>Wall transparency <b id="transparency-value">85%</b></span>
      <input type="range" id="transparency" min="0" max="100" value="85" />
    </label>
    <button id="reset">Reset ball</button>
    <p class="hint">
      Drag on a wall: place the ball and stretch an aim line (longer line = more force).<br />
      Drag empty space: orbit the camera. Scroll: zoom.
    </p>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
const CUBE = 10;
const HALF = CUBE / 2;
const R = 0.45;
const G = 22;
const MAX_SPEED = 45;
const FLOOR_FRICTION = 1.2;
const BOUNCE_TANGENT_LOSS = 0.995;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(13, 9, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 60;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
keyLight.position.set(10, 18, 8);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x88aaff, 0.35);
fillLight.position.set(-8, -6, -10);
scene.add(fillLight);

const wallMat = new THREE.MeshPhysicalMaterial({
  color: 0x9fd8ff,
  transparent: true,
  opacity: 0.15,
  roughness: 0.05,
  metalness: 0,
  side: THREE.DoubleSide,
  depthWrite: true
});
const walls = new THREE.Mesh(new THREE.BoxGeometry(CUBE, CUBE, CUBE), wallMat);
scene.add(walls);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(walls.geometry),
  new THREE.LineBasicMaterial({ color: 0x5fb2ff, transparent: true, opacity: 0.55 })
);
scene.add(edges);

const ball = new THREE.Mesh(
  new THREE.SphereGeometry(R, 48, 32),
  new THREE.MeshStandardMaterial({ color: 0xff7a1a, roughness: 0.35, metalness: 0.1 })
);
ball.visible = false;
scene.add(ball);

const aimLineGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(),
  new THREE.Vector3()
]);
const aimLine = new THREE.Line(aimLineGeo, new THREE.LineBasicMaterial({ color: 0x39ff88 }));
aimLine.visible = false;
scene.add(aimLine);

const pos = new THREE.Vector3();
const vel = new THREE.Vector3();
let launched = false;
let atRest = false;
let restitution = 0.75;

let aiming = false;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const aimPlane = new THREE.Plane();
const faceNormal = new THREE.Vector3();
const startPoint = new THREE.Vector3();
const aimPoint = new THREE.Vector3();

const bouncinessSlider = document.getElementById('bounciness');
const transparencySlider = document.getElementById('transparency');
const bouncinessValue = document.getElementById('bounciness-value');
const transparencyValue = document.getElementById('transparency-value');
const statusEl = document.getElementById('status');

function updateBounciness() {
  restitution = bouncinessSlider.value / 100;
  bouncinessValue.textContent = bouncinessSlider.value + '%';
}

function updateTransparency() {
  wallMat.opacity = 1 - transparencySlider.value / 100;
  edges.material.opacity = 0.25 + 0.35 * (transparencySlider.value / 100);
  transparencyValue.textContent = transparencySlider.value + '%';
}

bouncinessSlider.addEventListener('input', updateBounciness);
transparencySlider.addEventListener('input', updateTransparency);
updateBounciness();
updateTransparency();

document.getElementById('reset').addEventListener('click', resetBall);

function resetBall() {
  launched = false;
  atRest = false;
  ball.visible = false;
  aimLine.visible = false;
  setStatus('Drag on any wall to place the ball and aim.');
}

function setStatus(text) {
  statusEl.textContent = text;
}

function updateMouse(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return;
  updateMouse(event);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(walls);
  if (!hits.length) return;
  controls.enabled = false;
  aiming = true;
  faceNormal.copy(hits[0].face.normal).transformDirection(walls.matrixWorld);
  startPoint.copy(hits[0].point);
  aimPoint.copy(startPoint);
  aimPlane.setFromNormalAndCoplanarPoint(faceNormal, startPoint);
  pos.copy(startPoint).addScaledVector(faceNormal, -R);
  ball.position.copy(pos);
  ball.visible = true;
  launched = false;
  atRest = false;
  updateAimLine();
  setStatus('Stretch the line, then release to launch.');
});

window.addEventListener('pointermove', (event) => {
  if (!aiming) return;
  updateMouse(event);
  raycaster.setFromCamera(mouse, camera);
  if (!raycaster.ray.intersectPlane(aimPlane, aimPoint)) return;
  updateAimLine();
});

window.addEventListener('pointerup', () => {
  if (!aiming) return;
  aiming = false;
  controls.enabled = true;
  aimLine.visible = false;
  const drag = aimPoint.clone().sub(startPoint);
  const length = drag.length();
  if (length < 0.15) {
    vel.set(0, 0, 0);
  } else {
    const speed = Math.min(length * 4, MAX_SPEED);
    vel.copy(drag.normalize().multiplyScalar(speed));
  }
  launched = true;
  setStatus('Ball in flight.');
});

function updateAimLine() {
  const positions = aimLine.geometry.attributes.position;
  positions.setXYZ(0, startPoint.x, startPoint.y, startPoint.z);
  positions.setXYZ(1, aimPoint.x, aimPoint.y, aimPoint.z);
  positions.needsUpdate = true;
  aimLine.visible = true;
}

function step(h) {
  vel.y -= G * h;
  pos.addScaledVector(vel, h);
  const lim = HALF - R;
  let bounced = false;
  for (const axis of ['x', 'y', 'z']) {
    if (pos[axis] > lim) {
      pos[axis] = lim;
      if (vel[axis] > 0) {
        vel[axis] = -vel[axis] * restitution;
        bounced = true;
      }
    } else if (pos[axis] < -lim) {
      pos[axis] = -lim;
      if (vel[axis] < 0) {
        vel[axis] = -vel[axis] * restitution;
        bounced = true;
      }
    }
  }
  if (bounced) {
    vel.x *= BOUNCE_TANGENT_LOSS;
    vel.z *= BOUNCE_TANGENT_LOSS;
  }
  if (pos.y <= -lim + 1e-4) {
    const friction = Math.max(0, 1 - FLOOR_FRICTION * h);
    vel.x *= friction;
    vel.z *= friction;
    if (vel.lengthSq() < 0.02 && Math.abs(vel.y) < 0.6) {
      vel.set(0, 0, 0);
      pos.y = -lim;
      if (!atRest) {
        atRest = true;
        setStatus('Ball at rest. Drag on any wall to launch again.');
      }
    }
  }
  ball.position.copy(pos);
}

let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (launched && !atRest) {
    const substeps = 8;
    const h = dt / substeps;
    for (let i = 0; i < substeps; i++) {
      if (atRest) break;
      step(h);
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

  </script>
</body>
</html>
